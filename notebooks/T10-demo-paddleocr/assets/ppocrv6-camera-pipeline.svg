<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PP-OCRv6 Camera Inference Pipeline</title>
  <desc id="desc">Sequential diagram from a 640 by 480 camera frame through detection, crop preparation, ratio routing, recognition, CTC decoding, and OpenCV display.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#15345b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7f99"/>
    </marker>
    <style>
      .title { font: 700 44px 'DejaVu Sans', Arial, sans-serif; fill: #142b4a; }
      .subtitle { font: 400 21px 'DejaVu Sans', Arial, sans-serif; fill: #52677f; }
      .step { font: 700 16px 'DejaVu Sans', Arial, sans-serif; letter-spacing: 1.2px; }
      .card-title { font: 700 25px 'DejaVu Sans', Arial, sans-serif; fill: #152c49; }
      .card-body { font: 400 18px 'DejaVu Sans', Arial, sans-serif; fill: #4b6078; }
      .card-strong { font: 700 19px 'DejaVu Sans', Arial, sans-serif; fill: #1c3c61; }
      .note { font: 400 18px 'DejaVu Sans', Arial, sans-serif; fill: #435a73; }
      .arrow { stroke: #6b7f99; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .icon { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1420" cy="40" r="220" fill="#dceaff" opacity="0.55"/>
  <circle cx="90" cy="850" r="190" fill="#dff7f2" opacity="0.55"/>

  <text x="800" y="82" text-anchor="middle" class="title">PP-OCRv6 Camera Inference Pipeline</text>
  <text x="800" y="120" text-anchor="middle" class="subtitle">Sequential processing from camera input to OCR visualization</text>

  <!-- Connectors -->
  <path class="arrow" d="M 245 420 H 286"/>
  <path class="arrow" d="M 485 420 H 526"/>
  <path class="arrow" d="M 775 420 H 816"/>
  <path class="arrow" d="M 1085 420 H 1126"/>
  <path class="arrow" d="M 1325 420 H 1366"/>

  <!-- Step 1: Camera -->
  <g filter="url(#shadow)">
    <rect x="45" y="210" width="200" height="420" rx="28" fill="#ffffff" stroke="#bcd2f2" stroke-width="2"/>
  </g>
  <rect x="68" y="235" width="80" height="32" rx="16" fill="#e7f0ff"/>
  <text x="108" y="257" text-anchor="middle" class="step" fill="#3169b1">STEP 1</text>
  <g class="icon" stroke="#3776c4">
    <rect x="90" y="318" width="86" height="62" rx="10"/>
    <path d="M176 335 L202 321 V377 L176 363 Z"/>
    <circle cx="133" cy="349" r="14"/>
  </g>
  <text x="145" y="438" text-anchor="middle" class="card-title">Camera Input</text>
  <text x="145" y="480" text-anchor="middle" class="card-strong">640 × 480</text>
  <text x="145" y="512" text-anchor="middle" class="card-body">camera frame</text>

  <!-- Step 2: Detection -->
  <g filter="url(#shadow)">
    <rect x="285" y="210" width="200" height="420" rx="28" fill="#ffffff" stroke="#b7e2dc" stroke-width="2"/>
  </g>
  <rect x="308" y="235" width="80" height="32" rx="16" fill="#e1f7f3"/>
  <text x="348" y="257" text-anchor="middle" class="step" fill="#168174">STEP 2</text>
  <g class="icon" stroke="#159487">
    <rect x="332" y="308" width="106" height="82" rx="10"/>
    <rect x="347" y="324" width="42" height="22" rx="3"/>
    <rect x="374" y="354" width="48" height="20" rx="3"/>
    <path d="M320 320 V302 H338 M432 302 H450 V320 M320 378 V396 H338 M432 396 H450 V378"/>
  </g>
  <text x="385" y="438" text-anchor="middle" class="card-title">Detection</text>
  <text x="385" y="480" text-anchor="middle" class="card-strong">DET 640 × 640</text>
  <text x="385" y="512" text-anchor="middle" class="card-body">text regions</text>

  <!-- Step 3: Geometry -->
  <g filter="url(#shadow)">
    <rect x="525" y="210" width="250" height="420" rx="28" fill="#ffffff" stroke="#d2c5f3" stroke-width="2"/>
  </g>
  <rect x="548" y="235" width="80" height="32" rx="16" fill="#f0ebff"/>
  <text x="588" y="257" text-anchor="middle" class="step" fill="#7152b8">STEP 3</text>
  <g class="icon" stroke="#7655bf">
    <path d="M582 322 L642 307 L660 365 L600 380 Z"/>
    <path d="M650 310 L714 326 L698 384 L634 368 Z" opacity="0.5"/>
    <path d="M598 345 H644 M656 347 H701"/>
  </g>
  <text x="650" y="438" text-anchor="middle" class="card-title">Crop Preparation</text>
  <text x="650" y="480" text-anchor="middle" class="card-strong">Sort text polygons</text>
  <text x="650" y="514" text-anchor="middle" class="card-body">Perspective crops</text>

  <!-- Step 4: Router -->
  <g filter="url(#shadow)">
    <rect x="815" y="210" width="270" height="420" rx="28" fill="#ffffff" stroke="#f1cfaa" stroke-width="2"/>
  </g>
  <rect x="838" y="235" width="80" height="32" rx="16" fill="#fff1df"/>
  <text x="878" y="257" text-anchor="middle" class="step" fill="#b76b15">STEP 4</text>
  <g class="icon" stroke="#d17a17">
    <path d="M889 307 H938 V335"/>
    <path d="M938 335 L900 373 M938 335 L938 382 M938 335 L976 373"/>
    <circle cx="889" cy="307" r="8" fill="#d17a17"/>
    <circle cx="900" cy="373" r="8" fill="#d17a17"/>
    <circle cx="938" cy="382" r="8" fill="#d17a17"/>
    <circle cx="976" cy="373" r="8" fill="#d17a17"/>
  </g>
  <text x="950" y="438" text-anchor="middle" class="card-title">Ratio Router</text>
  <text x="950" y="480" text-anchor="middle" class="card-strong">2.5 · 5 · 10 · 15 · 25</text>
  <text x="950" y="514" text-anchor="middle" class="card-body">select REC input width</text>

  <!-- Step 5: Recognition -->
  <g filter="url(#shadow)">
    <rect x="1125" y="210" width="200" height="420" rx="28" fill="#ffffff" stroke="#efc3d1" stroke-width="2"/>
  </g>
  <rect x="1148" y="235" width="80" height="32" rx="16" fill="#ffeaf1"/>
  <text x="1188" y="257" text-anchor="middle" class="step" fill="#b94d72">STEP 5</text>
  <g class="icon" stroke="#c84f78">
    <path d="M1168 317 H1281 M1184 317 V378 M1265 317 V378"/>
    <path d="M1201 378 L1224 326 L1248 378 M1209 359 H1240"/>
  </g>
  <text x="1225" y="438" text-anchor="middle" class="card-title">Recognition</text>
  <text x="1225" y="480" text-anchor="middle" class="card-strong">REC inference</text>
  <text x="1225" y="514" text-anchor="middle" class="card-body">CTC text decoding</text>

  <!-- Step 6: Display -->
  <g filter="url(#shadow)">
    <rect x="1365" y="210" width="190" height="420" rx="28" fill="#ffffff" stroke="#bcd2f2" stroke-width="2"/>
  </g>
  <rect x="1388" y="235" width="80" height="32" rx="16" fill="#e7f0ff"/>
  <text x="1428" y="257" text-anchor="middle" class="step" fill="#3169b1">STEP 6</text>
  <g class="icon" stroke="#3776c4">
    <rect x="1409" y="305" width="102" height="72" rx="8"/>
    <path d="M1438 399 H1482 M1460 377 V399"/>
    <rect x="1422" y="318" width="42" height="20" rx="3"/>
    <path d="M1472 326 H1497 M1472 341 H1492 M1422 354 H1497"/>
  </g>
  <text x="1460" y="438" text-anchor="middle" class="card-title">Display</text>
  <text x="1460" y="480" text-anchor="middle" class="card-strong">OpenCV preview</text>
  <text x="1460" y="514" text-anchor="middle" class="card-body">BBOX + text</text>

  <!-- Supporting note -->
  <g>
    <rect x="300" y="695" width="1000" height="100" rx="24" fill="#ffffff" stroke="#ccd9e8" stroke-width="2"/>
    <circle cx="354" cy="745" r="22" fill="#e7f0ff"/>
    <path d="M354 733 V747 M354 758 V759" stroke="#3776c4" stroke-width="5" stroke-linecap="round"/>
    <text x="400" y="735" class="card-strong">Routing rule</text>
    <text x="400" y="767" class="note">Each text crop is sent to the smallest recognition model that can contain its aspect ratio.</text>
  </g>
</svg>
